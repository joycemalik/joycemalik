name: tend the garden

on:
  schedule:
    - cron: '17 3 * * *'   # daily, quietly
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Draw the garden, numbers and languages
        run: node scripts/generate.mjs
        env:
          # classic PAT with `repo` + `read:user` scopes, so private work is counted
          GH_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "joycemalik"
          git config user.email "joycemalik@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: tend the garden"
          git push
