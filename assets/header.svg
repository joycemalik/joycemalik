<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Joyce Malik. Stillness, with a leaf falling.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0f2a22"/>
      <stop offset="0.55" stop-color="#1d4a3a"/>
      <stop offset="1" stop-color="#3d6b52"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#cfe8c8" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#cfe8c8" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#b7d99a"/>
      <stop offset="1" stop-color="#5f9a62"/>
    </linearGradient>
    <style>
      .title { font: 300 64px Georgia, 'Times New Roman', serif; fill: #eaf3e4; letter-spacing: 2px; }
      .sub   { font: italic 300 18px Georgia, 'Times New Roman', serif; fill: #b9d3b4; letter-spacing: 1px; }
      .fall  { animation: fall 14s cubic-bezier(.45,.05,.55,.95) infinite; }
      .sway  { transform-box: fill-box; transform-origin: center; animation: sway 4.6s ease-in-out infinite; }
      .fade-in { animation: fadein 3s ease-out both; }
      .fade-in.d { animation-delay: 1.2s; }
      @keyframes fall {
        0%   { transform: translate(690px, -50px); opacity: 0; }
        8%   { opacity: 1; }
        50%  { transform: translate(610px, 150px); }
        92%  { opacity: 1; }
        100% { transform: translate(700px, 340px); opacity: 0; }
      }
      @keyframes sway {
        0%,100% { transform: rotate(-35deg); }
        50%     { transform: rotate(40deg); }
      }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .fall, .sway, .fade-in { animation: none; } .fall { transform: translate(650px,150px); } }
    </style>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#glow)"/>
  <text class="title fade-in" x="70" y="145">Joyce Malik</text>
  <text class="sub fade-in d" x="74" y="188">doing, because there is doing.</text>
  <g class="fall">
    <g class="sway">
      <path d="M0,-26 C20,-18 22,8 0,28 C-22,8 -20,-18 0,-26 Z" fill="url(#leaf)"/>
      <path d="M0,-22 L0,30" stroke="#2f5a43" stroke-width="1.4" fill="none"/>
    </g>
  </g>
</svg>
