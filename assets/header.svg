<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300" role="img" aria-label="Joyce Malik. A leaf with a small universe inside it, falling.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#08141f"/>
      <stop offset="0.5" stop-color="#12352f"/>
      <stop offset="1" stop-color="#2f5f4a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.3" r="0.6">
      <stop offset="0" stop-color="#9fd0c0" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#9fd0c0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cosmos" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3d"/>
      <stop offset="0.5" stop-color="#2a3f7a"/>
      <stop offset="1" stop-color="#2f7a68"/>
    </linearGradient>
    <radialGradient id="neb" cx="0.35" cy="0.4" r="0.6">
      <stop offset="0" stop-color="#b79ae0" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b79ae0" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="leafclip"><path id="lp" d="M0,-40 C32,-28 34,12 0,44 C-34,12 -32,-28 0,-40 Z"/></clipPath>
    <style>
      .title { font: 300 64px Georgia, 'Times New Roman', serif; fill: #eaf3e4; letter-spacing: 2px; }
      .sub   { font: italic 300 18px Georgia, 'Times New Roman', serif; fill: #b9d3b4; letter-spacing: 1px; }
      .fall  { animation: fall 16s cubic-bezier(.45,.05,.55,.95) infinite; }
      .sway  { transform-box: fill-box; transform-origin: center; animation: sway 5s ease-in-out infinite; }
      .tw    { animation: tw 4s ease-in-out infinite; }
      .orbit { transform-box: fill-box; transform-origin: center; animation: spin 22s linear infinite; }
      .fade-in { animation: fadein 3s ease-out both; }
      .fade-in.d { animation-delay: 1.2s; }
      @keyframes fall {
        0%   { transform: translate(690px, -60px); opacity: 0; }
        8%   { opacity: 1; }
        50%  { transform: translate(610px, 150px); }
        92%  { opacity: 1; }
        100% { transform: translate(700px, 350px); opacity: 0; }
      }
      @keyframes sway { 0%,100% { transform: rotate(-28deg); } 50% { transform: rotate(32deg); } }
      @keyframes tw { 0%,100% { opacity: .15; } 50% { opacity: .95; } }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes fadein { from { opacity: 0; } to { opacity: 1; } }
      @media (prefers-reduced-motion: reduce) { .fall, .sway, .tw, .orbit, .fade-in { animation: none; } .fall { transform: translate(650px,150px); } .tw { opacity: .6; } }
    </style>
  </defs>
  <rect width="900" height="300" fill="url(#bg)"/>
  <rect width="900" height="300" fill="url(#glow)"/>
